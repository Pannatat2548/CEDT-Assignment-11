name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write      # TODO#0c: สำหรับ OIDC authentication กับ cloud providers
  issues: write        # TODO#0b: สำหรับการเขียน comment แจ้งเตือนใน issues
  pull-requests: write # TODO#0b: สำหรับการเขียน comment แจ้งเตือนใน PR
  security-events: write # TODO#0a: สำหรับการอัปโหลดไฟล์ SARIF ไปยัง GitHub Security Tab
  actions: read

jobs:
  # GATE#0: Secret scanning
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # TODO#1: ตั้งเป็น 0 เพื่อดึงประวัติการ commit ทั้งหมดมาตรวจหาความลับที่อาจเคยหลุดในอดีต
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          # TODO#2 & #3: สแกนเปรียบเทียบกับ branch หลัก และเน้นเฉพาะ verified secrets
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --verified

      # TODO#4: เพิ่ม Gitleaks เพื่อช่วยสแกนซ้ำด้วย Regex ที่ครอบคลุมขึ้น
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GATE#1a: SAST via SonarQube 
  sast-scan:
    runs-on: ubuntu-latest
    needs: secret-scanning
    if: ${{ !cancelled() }} 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # TODO#5: ต้องใช้ประวัติเพื่อทำ Git Blame ให้ Sonar ระบุเจ้าของโค้ดที่มีปัญหาได้
          fetch-depth: 0

      # TODO#6: แก้ไขให้ใส่ Host URL เพื่อเชื่อมต่อกับ SonarCloud
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # GATE#1b: SAST via CodeQL
  codeql-scan:
    runs-on: ubuntu-latest
    needs: secret-scanning
    if: ${{ !cancelled() }} 
    strategy:
      fail-fast: false
      matrix:
        # TODO#7: กำหนดภาษาสำหรับโปรเจกต์ Next.js
        language: [ 'javascript-typescript' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # TODO#8: เลือกชุด Query ที่ตรวจทั้งความปลอดภัยและคุณภาพโค้ด
          queries: security-extended,security-and-quality

      # TODO#9: วิเคราะห์และแยกหมวดหมู่ตามภาษาที่ใช้ใน matrix
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # GATE#2: Dependency scanning
  dependency-scanning:
    runs-on: ubuntu-latest
    needs: [sast-scan, secret-scanning]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO#10: เตรียม Node environment
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # TODO#11: ติดตั้ง Dependencies เพื่อให้สแกนเนอร์เห็นไฟล์ lock และโครงสร้างโปรเจกต์
      - name: Install dependencies
        run: npm install

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        id: Depcheck
        with:
          project: 'DontEverPushThisCodeV2'
          path: '.'
          # TODO#12: ใช้ SARIF เพื่อแสดงผลในหน้า Security ของ GitHub
          format: 'SARIF'
          out: 'reports'
          # TODO#13: ตั้งค่าให้ Fail เมื่อเจอช่องโหว่ระดับ High (CVSS 7 ขึ้นไป)
          args: >
            --failOnCVSS 7
            --enableRetired

      # TODO#14: อัปโหลดไฟล์ SARIF
      - name: Upload Depcheck SARIF
        if: always() 
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      # TODO#15: อัปโหลด HTML report ไว้ดูรายละเอียดใน Artifacts
      - name: Upload Depcheck HTML report
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: depcheck-report
          path: reports/

  # GATE#3: Container scanning
  image-scanning:
    runs-on: ubuntu-latest
    needs: [dependency-scanning]
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # TODO#16: Build Docker Image ขึ้นมาก่อนสแกน
      - name: Build Docker image
        run: docker build -t my-app:latest .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'my-app:latest'
          # TODO#17: ต้องระบุ Format เป็น sarif
          format: 'sarif'
          output: 'trivy-results.sarif'
          # TODO#18: เน้นสแกนความรุนแรงระดับกลางถึงสูง
          severity: 'MEDIUM,HIGH,CRITICAL'
          # TODO#19: ข้ามช่องโหว่ที่ยังไม่มีแพตช์แก้เพื่อลด False Alarm
          ignore-unfixed: true
          exit-code: '0'

      # TODO#20: อัปโหลดผล Trivy ไปยัง Security Tab
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # TODO#21: เก็บผลลัพธ์เป็น Artifact
      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif